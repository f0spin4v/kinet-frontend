<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/perfil" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Editar perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="form" (ngSubmit)="guardar()" novalidate class="editar">
    <div class="field">
      <label class="field__label" for="nombres">Nombres</label>
      <div class="field__box" [class.field__box--error]="mensaje('nombres')">
        <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
        <input id="nombres" type="text" formControlName="nombres" autocomplete="given-name" />
      </div>
      @if (mensaje('nombres'); as msg) {
        <span class="field__error">{{ msg }}</span>
      }
    </div>

    <div class="field">
      <label class="field__label" for="apellidos">Apellidos</label>
      <div class="field__box" [class.field__box--error]="mensaje('apellidos')">
        <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
        <input id="apellidos" type="text" formControlName="apellidos" autocomplete="family-name" />
      </div>
      @if (mensaje('apellidos'); as msg) {
        <span class="field__error">{{ msg }}</span>
      }
    </div>

    <div class="field">
      <label class="field__label" for="nickname">Nickname</label>
      <div class="field__box" [class.field__box--error]="mensaje('nickname')">
        <ion-icon name="at-outline" aria-hidden="true"></ion-icon>
        <input id="nickname" type="text" formControlName="nickname"
               autocapitalize="off" spellcheck="false" />
      </div>
      @if (mensaje('nickname'); as msg) {
        <span class="field__error">{{ msg }}</span>
      }
    </div>

    <div class="field">
      <label class="field__label" for="fechaNacimiento">Fecha de nacimiento</label>
      <div class="field__box" [class.field__box--error]="mensaje('fechaNacimiento')">
        <ion-icon name="calendar-outline" aria-hidden="true"></ion-icon>
        <input id="fechaNacimiento" type="date" formControlName="fechaNacimiento" [max]="maxFecha" />
      </div>
      @if (mensaje('fechaNacimiento'); as msg) {
        <span class="field__error">{{ msg }}</span>
      } @else {
        <span class="field__hint">Opcional</span>
      }
    </div>

    @if (errorServidor()) {
      <p class="alert-error" role="alert">{{ errorServidor() }}</p>
    }

    <button type="submit" class="btn-primary" [disabled]="guardando() || form.pristine">
      @if (guardando()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Guardar cambios
      }
    </button>
  </form>
</ion-content>
