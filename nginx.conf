server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Evidencias de entrenamiento: hasta 5 MB (multipart de 6 MB en el backend)
  client_max_body_size 6m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://backend:8080;
    # Caddy ya pone estas cabeceras a todas las respuestas; Spring Security también las pone en /api y
    # salían repetidas (auditoría 03/11/2026, criterio 6.7.5). Se quitan las del backend y queda una sola.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Strict-Transport-Security;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Archivos con hash en el nombre: caché larga
  location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Rutas de Angular: evita el 404 al recargar
  location / {
    add_header Cache-Control "no-cache";
    # Content-Security-Policy (auditoría 03/11/2026, criterio 6.7.5): solo se cargan scripts propios; nada de
    # scripts en línea ni de otros dominios. Estilos en línea permitidos porque Ionic los usa en sus componentes.
    # img-src admite https: para las fotos de perfil, que son enlaces externos.
    # (HSTS, nosniff, X-Frame-Options y Referrer-Policy los pone Caddy; aquí no se repiten.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri $uri/ /index.html;
  }
}
