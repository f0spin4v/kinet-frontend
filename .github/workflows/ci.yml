# Integración continua (auditoría 03/11/2026, criterio 6.4.2): en cada push y pull request a main se revisa el
# estilo (ESLint), se compila la versión de producción y se corren las pruebas e2e con Playwright.
name: Frontend · lint, build y e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx ng lint
      - name: Build de producción
        run: npx ng build --configuration production
      - name: Navegador para Playwright
        run: npx playwright install --with-deps chromium
      - name: Pruebas e2e (escritorio)
        run: npx playwright test --project=escritorio
        env:
          E2E_SIN_VENTANA: '1'
          CI: '1'
      - name: Reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
